syntax = "proto3";

package iam.v1;

option go_package = "github.com/hayhandsome/msbd/services/cloud-access-core/proto/iam;iam";

service AuthService {
  rpc Login(LoginRequest) returns (TokenResponse);
  rpc Refresh(RefreshRequest) returns (TokenResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc Validate(ValidateRequest) returns (ValidateResponse);
}

message LoginRequest {
  string email = 1;
  string password = 2;
  string client_kind = 3;
  string device_fingerprint = 4;
  string client_ip = 5;
}

message RefreshRequest {
  string refresh_token = 1;
}

message LogoutRequest {
  string refresh_token = 1;
}

message ValidateRequest {
  string token = 1;
  TokenFormat format = 2;
}

enum TokenFormat {
  TOKEN_FORMAT_UNSPECIFIED = 0;
  TOKEN_FORMAT_JWT = 1;
  TOKEN_FORMAT_PASETO = 2;
}

message TokenResponse {
  string access_token = 1;
  string device_token = 2;
  string refresh_token = 3;
  int64 access_expires_in = 4;
  int64 refresh_expires_in = 5;
  string session_id = 6;
  string tenant_id = 7;
  string user_id = 8;
}

message LogoutResponse {
  bool revoked = 1;
}

message ValidateResponse {
  string subject = 1;
  string tenant_id = 2;
  string session_id = 3;
  repeated string roles = 4;
  string email = 5;
}
