[workspace]
members = [
  "audio",
  "guardian-host",
  "guardian",
  "net",
  "screenshot",
  "storage",
  "diagnostics"
]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0"
audio = { path = "audio" }
cpal = { version = "0.15" }
thiserror = "1.0"
tokio = { version = "1.37", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
napi = { version = "2", features = ["tokio_rt"] }
napi-derive = "2"
once_cell = "1.19"
tokio-stream = "0.1"
futures-util = "0.3"
tonic = { version = "0.11", features = ["transport"] }
prost = "0.12"
prost-types = "0.12"
sysinfo = "0.30"
screenshots = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
chrono = { version = "0.4", features = ["serde"] }
